# ============================================================
# Quantumult X 分流规则 —— 国内直连 / HuggingFace 走代理
#
# 用法：打开 QX → 配置 → 编辑当前配置 → 找到 [filter_local] 段
#      把这些行粘到该段的最前面（必须在 final 那行之前），保存 → 重载配置。
#
# 注意：
#   1) 下面写的 proxy 是 QX 内置策略关键字；如果你用的是自定义策略组
#      （例如「国外流量」），把 proxy 换成你的策略组名。
#   2) 最少改动方案：只抄 geoip, cn, direct 这一行，收益已经占 90%。
#   3) 改完必须重启正在跑的下载（老连接不会切线路）。
# ============================================================

[filter_local]

# ---------- 国外：必须走代理 ----------
host-suffix, huggingface.co, proxy
host-suffix, hf.co, proxy
host-suffix, xethub.hf.co, proxy
host-suffix, cdn-lfs.huggingface.co, proxy

# ---------- 国内：全部直连（关键的一行） ----------
# 覆盖清华/阿里/腾讯/微信/百度/B站等所有国内 IP
geoip, cn, direct

# 国内镜像站（保险起见再点名一次，避免 geoip 库判断失误）
host-suffix, hf-mirror.com, direct
host-suffix, modelscope.cn, direct
host-suffix, modelscope.aliyun.com, direct
host-suffix, aliyuncs.com, direct
host-suffix, tsinghua.edu.cn, direct
host-suffix, ustc.edu.cn, direct
host-suffix, qq.com, direct
host-suffix, weixin.qq.com, direct
host-suffix, wechat.com, direct
host-suffix, gtimg.com, direct

# ---------- 其余：保持你原来的默认策略 ----------
# 如果你的 final 是 direct，把下面这行改成 final, proxy
final, proxy
