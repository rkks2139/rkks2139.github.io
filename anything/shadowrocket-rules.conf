# ============================================================
# Shadowrocket 分流规则 —— 国内直连 / HuggingFace 走代理
#
# 用法：Shadowrocket → 配置 → 选中你正在用的配置 → 编辑纯文本
#      把下面 [Rule] 里的内容粘到 [Rule] 段最前面，保存。
#
# 注意：
#   1) PROXY 是关键字；如果用的是策略组（如「国外流量」），替换成组名。
#   2) 最少改动方案：只抄 GEOIP,CN,DIRECT 这一行，收益已经占 90%。
#   3) 改完在 Shadowrocket 里重新连接一次 VPN 生效。
# ============================================================

[Rule]

# ---------- 国外：必须走代理 ----------
DOMAIN-SUFFIX,huggingface.co,PROXY
DOMAIN-SUFFIX,hf.co,PROXY
DOMAIN-SUFFIX,xethub.hf.co,PROXY
DOMAIN-SUFFIX,cdn-lfs.huggingface.co,PROXY

# ---------- 国内：全部直连（关键的一行） ----------
GEOIP,CN,DIRECT

# 国内镜像站（保险起见再点名一次）
DOMAIN-SUFFIX,hf-mirror.com,DIRECT
DOMAIN-SUFFIX,modelscope.cn,DIRECT
DOMAIN-SUFFIX,modelscope.aliyun.com,DIRECT
DOMAIN-SUFFIX,aliyuncs.com,DIRECT
DOMAIN-SUFFIX,tsinghua.edu.cn,DIRECT
DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,gtimg.com,DIRECT

# ---------- 其余：保持你原来的默认策略 ----------
FINAL,PROXY
